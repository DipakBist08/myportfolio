version: "3.9"

services:
  backend:
    build: ./backend
    container_name: cms_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - cms_uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////app/data/cms.db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: cms_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cms_uploads:
