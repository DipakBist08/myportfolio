<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Admin Sign In</title>
<!--
  The admin panel's only authentication is the CMS's own login
  (JWT + optional MFA). This page used to run a second, browser-only
  password check first, which meant signing in twice. It now hands
  straight over to the CMS.
-->
<meta http-equiv="refresh" content="0; url=https://cms.dipakbist.com.np/">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0b1120; color: #94a3b8;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: #818cf8; }
</style>
<script>
  // Remove the old browser-only credentials and session left behind by the previous gate.
  try {
    localStorage.removeItem('_adm_c');
    sessionStorage.removeItem('_adm_s');
    sessionStorage.removeItem('_adm_a');
  } catch (e) {}
  window.location.replace('https://cms.dipakbist.com.np/');
</script>
</head>
<body>
  <p>Redirecting to the admin panel… <a href="https://cms.dipakbist.com.np/">Continue</a></p>
</body>
</html>
