<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-ancestors 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Sign In</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
        }

        .card {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 390px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            user-select: none;
        }

        h1 { font-size: 1.4rem; font-weight: 600; color: #f1f5f9; margin-bottom: 0.35rem; }

        .subtitle { font-size: 0.875rem; color: #64748b; margin-bottom: 1.75rem; }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 0.35rem;
            letter-spacing: 0.03em;
        }

        .account-badge {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(99,102,241,0.08);
            border: 1px solid rgba(99,102,241,0.18);
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
            margin-bottom: 1.25rem;
        }
        .account-badge-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #22c55e;
            flex-shrink: 0;
        }
        .account-badge-email {
            font-size: 0.82rem;
            color: #94a3b8;
            font-family: monospace;
            letter-spacing: 0.01em;
        }

        .input-group {
            position: relative;
            margin-bottom: 1rem;
        }

        .input-group input[type="password"],
        .input-group input[type="text"],
        .input-group input[type="email"] {
            width: 100%;
            padding: 0.7rem 2.75rem 0.7rem 1rem;
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }

        .input-group input::placeholder { color: #2d3f55; }

        .toggle-btn {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #475569;
            cursor: pointer;
            padding: 0.2rem;
            display: flex;
            align-items: center;
            transition: color 0.15s;
        }
        .toggle-btn:hover { color: #94a3b8; }

        .strength-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: -0.5rem;
            margin-bottom: 1rem;
        }
        .strength-bar {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.06);
            border-radius: 2px;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            width: 0;
            border-radius: 2px;
            transition: width 0.3s, background 0.3s;
        }
        .strength-label { font-size: 0.72rem; color: #475569; min-width: 42px; text-align: right; }

        .requirements {
            font-size: 0.75rem;
            color: #475569;
            margin-top: -0.5rem;
            margin-bottom: 1rem;
            line-height: 1.7;
        }

        button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, opacity 0.2s;
            margin-top: 0.25rem;
            letter-spacing: 0.02em;
        }
        button[type="submit"]:hover:not(:disabled) { background: #4f46e5; }
        button[type="submit"]:active:not(:disabled) { transform: scale(0.99); }
        button[type="submit"]:disabled { opacity: 0.45; cursor: not-allowed; }

        .alert {
            border-radius: 8px;
            padding: 0.65rem 0.9rem;
            font-size: 0.82rem;
            margin-bottom: 1rem;
            display: none;
            line-height: 1.5;
        }
        .alert--error {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.25);
            color: #f87171;
        }
        .alert--success {
            background: rgba(34,197,94,0.1);
            border: 1px solid rgba(34,197,94,0.25);
            color: #4ade80;
        }
        .alert--warning {
            background: rgba(234,179,8,0.1);
            border: 1px solid rgba(234,179,8,0.25);
            color: #fbbf24;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }
        .alert--warning svg { flex-shrink: 0; margin-top: 2px; }

        .footer-note {
            text-align: center;
            font-size: 0.72rem;
            color: #2d3f55;
            margin-top: 1.5rem;
        }
        .footer-note a { color: #475569; text-decoration: none; }
        .footer-note a:hover { color: #64748b; }

        .screen { display: none; }
    </style>
</head>
<body>
<div class="card">

    <div class="logo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Secure Admin
    </div>

    <!-- Lockout banner (shared) -->
    <div class="alert alert--warning" id="lockout-box" role="alert">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="lockout-msg"></span>
    </div>

    <!-- ══════════════════════════════════════════════
         SCREEN 1 — First-time setup
    ══════════════════════════════════════════════ -->
    <div class="screen" id="setup-screen">
        <h1>Create Password</h1>
        <p class="subtitle">Set your admin password for this account.</p>

        <!-- Account indicator -->
        <div class="account-badge" aria-label="Account">
            <div class="account-badge-dot"></div>
            <span class="account-badge-email" id="setup-email-display"></span>
        </div>

        <form id="setup-form" autocomplete="off" novalidate>
            <label for="setup-pass">Password</label>
            <div class="input-group">
                <input type="password" id="setup-pass" maxlength="128" required
                       autocomplete="new-password" spellcheck="false" autocorrect="off"
                       placeholder="Create a strong password" />
                <button type="button" class="toggle-btn" id="toggle-setup"
                        onclick="toggleVis('setup-pass','toggle-setup')" aria-label="Show password" tabindex="-1">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <div class="strength-row">
                <div class="strength-bar"><div class="strength-fill" id="setup-strength-fill"></div></div>
                <span class="strength-label" id="setup-strength-label"></span>
            </div>

            <label for="setup-confirm">Confirm Password</label>
            <div class="input-group">
                <input type="password" id="setup-confirm" maxlength="128" required
                       autocomplete="new-password" spellcheck="false" autocorrect="off"
                       placeholder="Repeat password" />
                <button type="button" class="toggle-btn" id="toggle-setup-confirm"
                        onclick="toggleVis('setup-confirm','toggle-setup-confirm')" aria-label="Show password" tabindex="-1">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>

            <p class="requirements">Min 12 chars · uppercase · lowercase · number · special character</p>

            <div class="alert alert--error" id="setup-error" role="alert"></div>
            <button type="submit" id="setup-btn">Set Password</button>
        </form>
    </div>

    <!-- ══════════════════════════════════════════════
         SCREEN 2 — Sign in
    ══════════════════════════════════════════════ -->
    <div class="screen" id="signin-screen">
        <h1>Admin Sign In</h1>
        <p class="subtitle">Enter your credentials to continue.</p>

        <!-- Account indicator -->
        <div class="account-badge" aria-label="Signing in as">
            <div class="account-badge-dot"></div>
            <span class="account-badge-email" id="signin-email-display"></span>
        </div>

        <form id="signin-form" autocomplete="off" novalidate>
            <label for="signin-email">Email</label>
            <div class="input-group">
                <input type="email" id="signin-email" maxlength="254" required
                       autocomplete="email" spellcheck="false" autocorrect="off"
                       placeholder="admin@example.com" autofocus />
            </div>

            <label for="signin-pass">Password</label>
            <div class="input-group">
                <input type="password" id="signin-pass" maxlength="128" required
                       autocomplete="current-password" spellcheck="false" autocorrect="off"
                       placeholder="Your password" />
                <button type="button" class="toggle-btn" id="toggle-signin"
                        onclick="toggleVis('signin-pass','toggle-signin')" aria-label="Show password" tabindex="-1">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>

            <div class="alert alert--error" id="signin-error" role="alert"></div>
            <button type="submit" id="signin-btn">Sign In</button>
        </form>
        <p class="footer-note"><a href="?reset">Change password</a></p>
    </div>

    <!-- ══════════════════════════════════════════════
         SCREEN 3 — Change password (?reset flow)
         Requires email + current password — prevents unauthorized reset
    ══════════════════════════════════════════════ -->
    <div class="screen" id="change-screen">
        <h1>Change Password</h1>
        <p class="subtitle">Verify your credentials to set a new password.</p>

        <!-- Account indicator -->
        <div class="account-badge" aria-label="Account">
            <div class="account-badge-dot"></div>
            <span class="account-badge-email" id="change-email-display"></span>
        </div>

        <form id="change-form" autocomplete="off" novalidate>
            <label for="change-email">Email</label>
            <div class="input-group">
                <input type="email" id="change-email" maxlength="254" required
                       autocomplete="email" spellcheck="false" autocorrect="off"
                       placeholder="admin@example.com" autofocus />
            </div>

            <label for="change-current">Current Password</label>
            <div class="input-group">
                <input type="password" id="change-current" maxlength="128" required
                       autocomplete="current-password" spellcheck="false" autocorrect="off"
                       placeholder="Current password" />
                <button type="button" class="toggle-btn" id="toggle-change-current"
                        onclick="toggleVis('change-current','toggle-change-current')" aria-label="Show password" tabindex="-1">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>

            <label for="change-new">New Password</label>
            <div class="input-group">
                <input type="password" id="change-new" maxlength="128" required
                       autocomplete="new-password" spellcheck="false" autocorrect="off"
                       placeholder="New password" />
                <button type="button" class="toggle-btn" id="toggle-change-new"
                        onclick="toggleVis('change-new','toggle-change-new')" aria-label="Show password" tabindex="-1">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <div class="strength-row">
                <div class="strength-bar"><div class="strength-fill" id="change-strength-fill"></div></div>
                <span class="strength-label" id="change-strength-label"></span>
            </div>

            <label for="change-confirm">Confirm New Password</label>
            <div class="input-group">
                <input type="password" id="change-confirm" maxlength="128" required
                       autocomplete="new-password" spellcheck="false" autocorrect="off"
                       placeholder="Repeat new password" />
                <button type="button" class="toggle-btn" id="toggle-change-confirm"
                        onclick="toggleVis('change-confirm','toggle-change-confirm')" aria-label="Show password" tabindex="-1">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>

            <div class="alert alert--error"   id="change-error"   role="alert"></div>
            <div class="alert alert--success" id="change-success" role="status"></div>
            <button type="submit" id="change-btn">Change Password</button>
        </form>
        <p class="footer-note"><a href="?">Back to sign in</a></p>
    </div>

</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════
   CONFIGURATION
═══════════════════════════════════════════════════════════ */
const CFG = Object.freeze({
    ADMIN_EMAIL  : 'mbdds54@gmail.com',
    CMS_URL      : 'https://cms.dipakbist.com.np',
    CRED_KEY     : '_adm_c',
    SESSION_KEY  : '_adm_s',
    ATTEMPT_KEY  : '_adm_a',
    SESSION_TTL  : 60 * 60 * 1000,           // 1 hour
    PBKDF2_ITER  : 310_000,                  // OWASP 2024 minimum for PBKDF2-SHA256
    MIN_LEN      : 12,
    MAX_LEN      : 128,
    MAX_ATTEMPTS : 5,
    // Progressive lockout per failure count (ms). Index = failure count.
    LOCKOUTS     : [0, 0, 30_000, 120_000, 900_000, 1_800_000],
});

/* ═══════════════════════════════════════════════════════════
   CRYPTO — PBKDF2-SHA256 with random salt
═══════════════════════════════════════════════════════════ */
function generateSalt() {
    return Array.from(crypto.getRandomValues(new Uint8Array(32)))
        .map(b => b.toString(16).padStart(2, '0')).join('');
}

async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey(
        'raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']
    );
    const bits = await crypto.subtle.deriveBits(
        { name: 'PBKDF2', salt: enc.encode(salt), iterations: CFG.PBKDF2_ITER, hash: 'SHA-256' },
        key, 256
    );
    return Array.from(new Uint8Array(bits))
        .map(b => b.toString(16).padStart(2, '0')).join('');
}

// SHA-256 digest (used for email binding and fingerprint — not password hashing)
async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// Timing-safe comparison — prevents timing-based brute force detection
function timingSafeEqual(a, b) {
    const maxLen = Math.max(a.length, b.length);
    let diff = a.length ^ b.length;
    for (let i = 0; i < maxLen; i++) {
        diff |= (a.charCodeAt(i) || 0) ^ (b.charCodeAt(i) || 0);
    }
    return diff === 0;
}

function generateToken() {
    return Array.from(crypto.getRandomValues(new Uint8Array(32)))
        .map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ═══════════════════════════════════════════════════════════
   CREDENTIAL STORAGE — stores hashed password + email binding
═══════════════════════════════════════════════════════════ */
function getCred() {
    try { return JSON.parse(localStorage.getItem(CFG.CRED_KEY) || 'null'); }
    catch { return null; }
}
function saveCred(passHash, salt, emailHash) {
    localStorage.setItem(CFG.CRED_KEY, JSON.stringify({
        h: passHash, s: salt, e: emailHash, v: 2
    }));
}
function hasCred() { const c = getCred(); return !!(c?.h && c?.s && c?.v === 2); }

/* ═══════════════════════════════════════════════════════════
   SESSION — stored in sessionStorage (cleared on tab close)
   Includes fingerprint to bind session to the browser context
═══════════════════════════════════════════════════════════ */
async function getFingerprint() {
    return sha256(navigator.userAgent + navigator.language + screen.width + screen.height);
}

async function createSession() {
    const fp = await getFingerprint();
    sessionStorage.setItem(CFG.SESSION_KEY, JSON.stringify({
        t: generateToken(),
        fp,
        exp: Date.now() + CFG.SESSION_TTL,
    }));
}

async function isSessionValid() {
    try {
        const s = JSON.parse(sessionStorage.getItem(CFG.SESSION_KEY) || 'null');
        if (!s?.t || Date.now() >= s.exp) return false;
        const fp = await getFingerprint();
        return timingSafeEqual(s.fp, fp);
    } catch { return false; }
}

/* ═══════════════════════════════════════════════════════════
   RATE LIMITING — brute force protection
   sessionStorage resets on browser close but persists across reloads
═══════════════════════════════════════════════════════════ */
function getAttempts() {
    try { return JSON.parse(sessionStorage.getItem(CFG.ATTEMPT_KEY) || '{"n":0,"until":0}'); }
    catch { return { n: 0, until: 0 }; }
}
function setAttempts(d) { sessionStorage.setItem(CFG.ATTEMPT_KEY, JSON.stringify(d)); }
function clearAttempts() { sessionStorage.removeItem(CFG.ATTEMPT_KEY); }

function recordFailure() {
    const d = getAttempts();
    d.n = (d.n || 0) + 1;
    const lockMs = CFG.LOCKOUTS[Math.min(d.n, CFG.LOCKOUTS.length - 1)] || 0;
    d.until = lockMs > 0 ? Date.now() + lockMs : 0;
    setAttempts(d);
    return d;
}
function getLockoutMs() { return Math.max(0, getAttempts().until - Date.now()); }
function isLockedOut()  { return getLockoutMs() > 0; }
function attemptsLeft() { return Math.max(0, CFG.MAX_ATTEMPTS - getAttempts().n); }

/* ═══════════════════════════════════════════════════════════
   INPUT VALIDATION
═══════════════════════════════════════════════════════════ */
function sanitizeStr(val) {
    return typeof val === 'string' ? val : '';
}

function validatePassword(pass) {
    if (!pass || pass.trim().length === 0) return 'Password cannot be blank.';
    if (pass.length < CFG.MIN_LEN)  return `Password must be at least ${CFG.MIN_LEN} characters.`;
    if (pass.length > CFG.MAX_LEN)  return 'Password exceeds maximum length.';
    return null;
}

function validateNewPassword(pass) {
    const base = validatePassword(pass);
    if (base) return base;
    if (!/[A-Z]/.test(pass))        return 'Add at least one uppercase letter.';
    if (!/[a-z]/.test(pass))        return 'Add at least one lowercase letter.';
    if (!/[0-9]/.test(pass))        return 'Add at least one number.';
    if (!/[^A-Za-z0-9]/.test(pass)) return 'Add at least one special character (!@#$…).';
    return null;
}

/* ═══════════════════════════════════════════════════════════
   PASSWORD STRENGTH METER
═══════════════════════════════════════════════════════════ */
function scorePassword(pass) {
    if (!pass) return 0;
    let s = 0;
    if (pass.length >= CFG.MIN_LEN) s++;
    if (pass.length >= 16) s++;
    if (/[A-Z]/.test(pass)) s++;
    if (/[a-z]/.test(pass)) s++;
    if (/[0-9]/.test(pass)) s++;
    if (/[^A-Za-z0-9]/.test(pass)) s++;
    if (pass.length >= 20) s++;
    return Math.min(4, Math.floor(s * 4 / 7));
}

function updateStrength(pass, fillId, labelId) {
    const fill  = document.getElementById(fillId);
    const label = document.getElementById(labelId);
    if (!fill || !label) return;
    const score = scorePassword(pass);
    const W = ['0%', '25%', '50%', '75%', '100%'];
    const C = ['transparent', '#ef4444', '#f97316', '#eab308', '#22c55e'];
    const L = ['', 'Weak', 'Fair', 'Good', 'Strong'];
    fill.style.width = W[score];
    fill.style.background = C[score];
    label.textContent = pass ? L[score] : '';
    label.style.color = C[score];
}

/* ═══════════════════════════════════════════════════════════
   LOCKOUT COUNTDOWN DISPLAY
═══════════════════════════════════════════════════════════ */
let _lockTimer = null;

function startLockout() {
    const box = document.getElementById('lockout-box');
    const msg = document.getElementById('lockout-msg');
    if (!box || !msg) return;

    if (_lockTimer) clearInterval(_lockTimer);

    function tick() {
        const ms = getLockoutMs();
        if (ms <= 0) {
            box.style.display = 'none';
            clearInterval(_lockTimer);
            _lockTimer = null;
            ['signin-btn','change-btn'].forEach(id => {
                const b = document.getElementById(id);
                if (b) b.disabled = false;
            });
            return;
        }
        const s = Math.ceil(ms / 1000);
        const m = Math.floor(s / 60);
        msg.textContent = `Too many failed attempts. Try again in ${m > 0 ? m + 'm ' : ''}${s % 60}s.`;
        box.style.display = 'flex';
        ['signin-btn','change-btn'].forEach(id => {
            const b = document.getElementById(id);
            if (b) b.disabled = true;
        });
    }

    tick();
    if (getLockoutMs() > 0) _lockTimer = setInterval(tick, 1000);
}

/* ═══════════════════════════════════════════════════════════
   UI HELPERS — all DOM writes use textContent (XSS-safe)
═══════════════════════════════════════════════════════════ */
function showScreen(id) {
    ['setup-screen', 'signin-screen', 'change-screen'].forEach(s => {
        document.getElementById(s).style.display = (s === id) ? '' : 'none';
    });
}

function showAlert(id, msg, type) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = msg;  // textContent — never innerHTML, prevents XSS
    el.className = `alert alert--${type}`;
    el.style.display = 'block';
}

function hideAlert(id) {
    const el = document.getElementById(id);
    if (el) { el.textContent = ''; el.style.display = 'none'; }
}

function setBtn(id, text, disabled) {
    const el = document.getElementById(id);
    if (el) { el.textContent = text; el.disabled = disabled; }
}

/* ═══════════════════════════════════════════════════════════
   SHOW / HIDE PASSWORD TOGGLE
═══════════════════════════════════════════════════════════ */
const EYE_ON  = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
const EYE_OFF = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

function toggleVis(inputId, btnId) {
    const input = document.getElementById(inputId);
    const btn   = document.getElementById(btnId);
    if (!input || !btn) return;
    const reveal = input.type === 'password';
    input.type = reveal ? 'text' : 'password';
    btn.innerHTML = reveal ? EYE_OFF : EYE_ON;  // SVG is safe — no user input here
    btn.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
}

/* ═══════════════════════════════════════════════════════════
   OPEN REDIRECT GUARD — validate CMS URL before navigating
═══════════════════════════════════════════════════════════ */
function safeCmsRedirect() {
    try {
        const u = new URL(CFG.CMS_URL);
        if (!['http:', 'https:'].includes(u.protocol)) return;
        window.location.replace(CFG.CMS_URL);
    } catch {
        // Invalid URL — do nothing
    }
}

/* ═══════════════════════════════════════════════════════════
   BOOT — decide which screen to show
═══════════════════════════════════════════════════════════ */
// Populate email displays (textContent is XSS-safe)
document.querySelectorAll('.account-badge-email').forEach(el => {
    el.textContent = CFG.ADMIN_EMAIL;
});

// Redirect immediately if a valid session exists
isSessionValid().then(valid => {
    if (valid) safeCmsRedirect();
});

const isReset = /[?&]reset/.test(location.search);

if (isReset) {
    showScreen(hasCred() ? 'change-screen' : 'setup-screen');
} else if (!hasCred()) {
    showScreen('setup-screen');
} else {
    showScreen('signin-screen');
    if (isLockedOut()) startLockout();
}

/* ═══════════════════════════════════════════════════════════
   SETUP FORM
═══════════════════════════════════════════════════════════ */
document.getElementById('setup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert('setup-error');

    const pass    = sanitizeStr(document.getElementById('setup-pass').value);
    const confirm = sanitizeStr(document.getElementById('setup-confirm').value);

    const err = validateNewPassword(pass);
    if (err) { showAlert('setup-error', err, 'error'); return; }
    if (!timingSafeEqual(pass, confirm)) {
        showAlert('setup-error', 'Passwords do not match.', 'error');
        document.getElementById('setup-confirm').value = '';
        return;
    }

    setBtn('setup-btn', 'Saving…', true);

    const salt      = generateSalt();
    const passHash  = await deriveKey(pass, salt);
    const emailHash = await sha256(CFG.ADMIN_EMAIL);
    saveCred(passHash, salt, emailHash);

    document.getElementById('setup-pass').value    = '';
    document.getElementById('setup-confirm').value = '';

    window.location.replace(location.pathname);
});

document.getElementById('setup-pass').addEventListener('input', function () {
    updateStrength(this.value, 'setup-strength-fill', 'setup-strength-label');
});

/* ═══════════════════════════════════════════════════════════
   SIGN-IN FORM
   Email and password validated together — never reveal which
   field was wrong (prevents username enumeration attacks)
═══════════════════════════════════════════════════════════ */
document.getElementById('signin-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert('signin-error');

    if (isLockedOut()) { startLockout(); return; }

    const email = sanitizeStr(document.getElementById('signin-email').value).toLowerCase().trim();
    const pass  = sanitizeStr(document.getElementById('signin-pass').value);

    if (!email || !pass) {
        showAlert('signin-error', 'Enter your email and password.', 'error');
        return;
    }

    setBtn('signin-btn', 'Verifying…', true);

    const cred = getCred();
    if (!cred?.h || !cred?.s || cred?.v !== 2) {
        localStorage.removeItem(CFG.CRED_KEY);
        window.location.replace(location.pathname);
        return;
    }

    // Always run full PBKDF2 before comparing anything (prevents timing leaks on short-circuit)
    const passHash  = await deriveKey(pass, cred.s);
    const emailHash = await sha256(email);

    // Wipe fields before comparison result is known
    document.getElementById('signin-pass').value  = '';
    document.getElementById('signin-email').value = '';

    const passOk  = timingSafeEqual(passHash,  cred.h);
    const emailOk = timingSafeEqual(emailHash, cred.e);

    if (passOk && emailOk) {
        clearAttempts();
        await createSession();
        safeCmsRedirect();
    } else {
        const d    = recordFailure();
        const left = attemptsLeft();
        if (isLockedOut()) {
            startLockout();
        } else {
            // Generic message — never say which field was wrong
            showAlert(
                'signin-error',
                left > 0
                    ? `Invalid email or password — ${left} attempt${left === 1 ? '' : 's'} remaining.`
                    : 'Invalid email or password.',
                'error'
            );
        }
        setBtn('signin-btn', 'Sign In', isLockedOut());
        if (!isLockedOut()) document.getElementById('signin-email').focus();
    }
});

/* ═══════════════════════════════════════════════════════════
   CHANGE-PASSWORD FORM (?reset flow)
   Requires email + current password — attacker cannot reset
   without knowing both
═══════════════════════════════════════════════════════════ */
document.getElementById('change-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert('change-error');
    hideAlert('change-success');

    if (isLockedOut()) { startLockout(); return; }

    const email   = sanitizeStr(document.getElementById('change-email').value).toLowerCase().trim();
    const current = sanitizeStr(document.getElementById('change-current').value);
    const newPass = sanitizeStr(document.getElementById('change-new').value);
    const confirm = sanitizeStr(document.getElementById('change-confirm').value);

    if (!email || !current) {
        showAlert('change-error', 'Enter your email and current password.', 'error');
        return;
    }

    const newErr = validateNewPassword(newPass);
    if (newErr) { showAlert('change-error', newErr, 'error'); return; }

    if (!timingSafeEqual(newPass, confirm)) {
        showAlert('change-error', 'New passwords do not match.', 'error');
        document.getElementById('change-confirm').value = '';
        return;
    }
    if (newPass === current) {
        showAlert('change-error', 'New password must differ from current.', 'error');
        return;
    }

    setBtn('change-btn', 'Verifying…', true);

    const cred = getCred();
    if (!cred?.h || !cred?.s || cred?.v !== 2) {
        showScreen('setup-screen');
        return;
    }

    const currentHash = await deriveKey(current, cred.s);
    const emailHash   = await sha256(email);
    document.getElementById('change-current').value = '';
    document.getElementById('change-email').value   = '';

    const passOk  = timingSafeEqual(currentHash, cred.h);
    const emailOk = timingSafeEqual(emailHash,   cred.e);

    if (!passOk || !emailOk) {
        const d = recordFailure();
        const left = attemptsLeft();
        if (isLockedOut()) {
            startLockout();
        } else {
            showAlert(
                'change-error',
                left > 0
                    ? `Invalid email or password — ${left} attempt${left === 1 ? '' : 's'} remaining.`
                    : 'Invalid email or password.',
                'error'
            );
        }
        setBtn('change-btn', 'Change Password', isLockedOut());
        return;
    }

    setBtn('change-btn', 'Saving…', true);

    const salt      = generateSalt();
    const passHash  = await deriveKey(newPass, salt);
    const newEmailH = await sha256(CFG.ADMIN_EMAIL);
    saveCred(passHash, salt, newEmailH);

    document.getElementById('change-new').value     = '';
    document.getElementById('change-confirm').value = '';

    clearAttempts();
    showAlert('change-success', 'Password changed. Redirecting to sign in…', 'success');

    setTimeout(() => window.location.replace(location.pathname), 1500);
});

document.getElementById('change-new').addEventListener('input', function () {
    updateStrength(this.value, 'change-strength-fill', 'change-strength-label');
});
</script>
