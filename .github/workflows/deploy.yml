name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Portfolio (root static site) ─────────────────────────
  deploy-portfolio:
    name: Portfolio → dipakbist.com.np
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_PORTFOLIO }}
          working-directory: ./
          vercel-args: --prod

  # ── Blog (Next.js) ───────────────────────────────────────
  deploy-blog:
    name: Blog → blog.dipakbist.com.np
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: blog

      - name: Build
        run: npm run build
        working-directory: blog
        env:
          NEXT_PUBLIC_BASE_URL: https://blog.dipakbist.com.np

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_BLOG }}
          working-directory: ./blog
          vercel-args: --prod

  # ── CMS Admin (Vite + React) ──────────────────────────────
  deploy-cms:
    name: CMS Admin → cms.dipakbist.com.np
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cms/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cms/frontend

      - name: Build
        run: npm run build
        working-directory: cms/frontend
        env:
          VITE_API_URL: https://api.dipakbist.com.np
          VITE_APP_NAME: QA Portfolio CMS

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_CMS }}
          working-directory: ./cms/frontend
          vercel-args: --prod
